<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saber-Tea</title>
<link rel="icon" href="assets/Icon Transparent.png">
<style>
  :root {
    --leaf:  #a8cf8e;   /* right hand: logo's native green */
    --berry: #ff4d6d;   /* left hand: tinted leaf */
    --bg:    #070b10;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    display: grid;
    place-items: center;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e8f0e8;
    /* iOS: stop the slash gesture from selecting or scrolling the page */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #overlay {
    position: fixed; inset: 0;
    display: grid; place-content: center; justify-items: center;
    gap: 1rem; text-align: center;
    background: radial-gradient(ellipse at center, #0b1420 0%, var(--bg) 70%);
  }
  #overlay[hidden] { display: none; }
  #overlay h1 { font-size: clamp(2rem, 9vw, 3.5rem); letter-spacing: -.02em; color: var(--leaf); }
  #overlay p  { max-width: 30ch; color: rgba(232,240,232,.6); font-size: .95rem; }

  button {
    font: inherit; font-weight: 600;
    padding: .7rem 2rem; border-radius: 999px;
    border: 1px solid var(--leaf); background: transparent; color: var(--leaf);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--leaf); color: var(--bg); }
  button:disabled { opacity: .5; cursor: default; }

  #song { display: grid; gap: .75rem; justify-items: center; }
  #song[hidden] { display: none; }
  .filebtn {
    font-weight: 600; padding: .7rem 2rem; border-radius: 999px;
    border: 1px solid rgba(232,240,232,.3); color: rgba(232,240,232,.8);
    cursor: pointer;
  }
  .filebtn:hover { border-color: var(--leaf); color: var(--leaf); }
  .note { font-size: .8rem; color: rgba(232,240,232,.4); }

  .ghost { border-color: rgba(232,240,232,.3); color: rgba(232,240,232,.75); }
  .ghost:hover:not(:disabled) { background: transparent; border-color: var(--leaf); color: var(--leaf); }
  .corner {
    position: fixed; right: 1rem; bottom: 1rem; z-index: 2;
    padding: .45rem 1.1rem; font-size: .85rem;
  }
  .corner[hidden] { display: none; }

  #result { display: grid; gap: .3rem; }
  #result[hidden] { display: none; }
  #result .big { font-size: 2.6rem; font-weight: 700; color: var(--leaf); }
  #result .row { color: rgba(232,240,232,.6); font-size: .9rem; }
  #result .best { color: var(--berry); font-weight: 600; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="overlay">
    <h1>Saber-Tea</h1>
    <p>Chém lá trà bằng tay thật. Cần webcam và đủ sáng.</p>
    <div id="result" hidden></div>

    <button id="start">Bật camera</button>
    <button id="pointer" class="ghost">Chơi bằng chuột</button>

    <div id="song" hidden>
      <button id="demo">Chơi nhạc demo</button>
      <label class="filebtn">
        Chọn file nhạc
        <input id="file" type="file" accept="audio/*" hidden>
      </label>
      <p class="note">File nhạc không rời khỏi máy bạn.</p>
    </div>

    <p id="status"></p>
  </div>

  <button id="mode" class="ghost corner" hidden>Dùng chuột</button>

  <script type="module" src="game.js"></script>
</body>
</html>
