<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saber-Tea</title>
<link rel="icon" href="assets/Icon Transparent.png">
<style>
  :root {
    --leaf:  #a8cf8e;   /* right hand: logo's native green */
    --berry: #ff4d6d;   /* left hand: tinted leaf */
    --bg:    #070b10;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    display: grid;
    place-items: center;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #e8f0e8;
    /* iOS: stop the slash gesture from selecting or scrolling the page */
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <script type="module" src="game.js"></script>
</body>
</html>
